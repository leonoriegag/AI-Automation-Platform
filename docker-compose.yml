services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-automation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora_automation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexora_automation}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexora-network

networks:
  nexora-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
